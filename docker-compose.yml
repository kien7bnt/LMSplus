services:
  postgres:
    image: postgres:16-alpine
    container_name: lmsplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lmsplus_dev_password
      POSTGRES_DB: lmsplus
    ports:
      - "5432:5432"
    volumes:
      - lmsplus_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lmsplus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lmsplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  lmsplus_pgdata:
